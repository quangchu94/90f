services:
  web:
    build:
      context: .
      args:
        VITE_ESPN_SITE_API_BASE_URL: ${VITE_ESPN_SITE_API_BASE_URL:-/api/espn/site}
        VITE_ESPN_CORE_API_BASE_URL: ${VITE_ESPN_CORE_API_BASE_URL:-/api/espn/core}
        VITE_ESPN_STANDINGS_API_BASE_URL: ${VITE_ESPN_STANDINGS_API_BASE_URL:-/api/espn/v2}
        VITE_ESPN_WEB_API_BASE_URL: ${VITE_ESPN_WEB_API_BASE_URL:-/api/espn/web}
    image: 90f-web:latest
    ports:
      - "8080:80"
    restart: unless-stopped

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/espn/site/ {
    proxy_pass https://site.api.espn.com/apis/site/v2/;
    proxy_ssl_server_name on;
    proxy_set_header Host site.api.espn.com;
    proxy_set_header Accept application/json;
    add_header Cache-Control "public, max-age=60";
  }

  location /api/espn/v2/ {
    proxy_pass https://site.api.espn.com/apis/v2/;
    proxy_ssl_server_name on;
    proxy_set_header Host site.api.espn.com;
    proxy_set_header Accept application/json;
    add_header Cache-Control "public, max-age=300";
  }

  location /api/espn/core/ {
    proxy_pass https://sports.core.api.espn.com/v2/;
    proxy_ssl_server_name on;
    proxy_set_header Host sports.core.api.espn.com;
    proxy_set_header Accept application/json;
    add_header Cache-Control "public, max-age=300";
  }

  location /api/espn/web/ {
    proxy_pass https://site.web.api.espn.com/apis/site/v2/;
    proxy_ssl_server_name on;
    proxy_set_header Host site.web.api.espn.com;
    proxy_set_header Accept application/json;
    add_header Cache-Control "public, max-age=60";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /manifest.webmanifest {
    try_files $uri =404;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=300";
  }

  location = /sw.js {
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "SAMEORIGIN";
}
